# `trunk serve` (and `trunk build`) drive the existing wasm-pack packer, then
# copy its output into dist/ via the trunk hooks in web/index.html. The app is
# plain JS + wasm-bindgen output, not a Trunk-managed Rust crate, so the target
# HTML lives in the generated .web-pack/ directory (no Cargo.toml there).
[build]
target = ".web-pack/index.html"
dist = "dist"
filehash = false

[[hooks]]
stage = "pre_build"
command = "python3"
command_arguments = ["tools/web_pack.py", "--out", ".web-pack"]

# The target HTML and web/pkg are generated by the hook, so watching those
# directories would rebuild in a loop. Watch the real sources instead.
[watch]
watch = ["web/index.html", "web/app.js", "web/worker.js", "src", "tools", "data", "levels", "macros", "assets", "audio", "Cargo.toml", "Cargo.lock"]
ignore = [".web-pack", "dist", "target", "web/pkg"]
